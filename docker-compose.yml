# ============================================================
# Deploy cepat HealthHub (Next.js + PostgreSQL) dengan Docker.
#
#   docker compose up -d --build
#
#   # 1) buat tabel — jalankan dari repo di host (port 5432 dipublikasikan):
#   DATABASE_URL="postgresql://postgres:layanankesehatan@127.0.0.1:5432/app1_db" \
#     npm run db:migrate
#
#   # 2) isi data demo (sekali saja)
#   curl http://localhost:3000/api/seed
#
# Lalu buka http://localhost:3000
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-layanankesehatan}
      POSTGRES_DB: ${POSTGRES_DB:-app1_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app1_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-layanankesehatan}@db:5432/${POSTGRES_DB:-app1_db}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
